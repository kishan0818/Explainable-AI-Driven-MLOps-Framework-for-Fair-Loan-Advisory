version: '3.8'

services:
  backend:
    build:
      context: ./TWXAI_backend
      dockerfile: Dockerfile
    container_name: twxai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./TWXAI_backend/.env
    networks:
      - twxai-network
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twxai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # For browser access
    depends_on:
      - backend
    networks:
      - twxai-network
    restart: always

networks:
  twxai-network:
    driver: bridge
