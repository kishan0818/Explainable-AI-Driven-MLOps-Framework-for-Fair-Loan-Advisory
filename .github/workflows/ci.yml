name: CI/CD Evaluation & Automated Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-mlops-test:
    name: Backend, MLOps & Agent Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r TWXAI_backend/requirements.txt

      - name: Run Agentic AI & LLMOps Evaluation Benchmark Suite
        run: |
          python TWXAI_backend/evaluate_agent_metrics.py

      - name: Run Endpoints & Unit Tests
        run: |
          python test_endpoints_verification.py

  frontend-build-check:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.0

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Type Check & Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
